name: Build Saif Mini Markeet APK

on:
  push:
    branches: [saif-mini-markeet]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk saif-mini-markeet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: saif-mini-markeet-apk
          path: saif-mini-markeet.apk

      # Its own tag, and not marked "latest", so the Saif Buvet release stays as it is.
      - name: Publish it on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mini-markeet --yes --cleanup-tag || true
          gh release create mini-markeet saif-mini-markeet.apk --title "Saif Mini Markeet" --notes "Download saif-mini-markeet.apk on your Android phone and install it." --target "$GITHUB_SHA" --latest=false
