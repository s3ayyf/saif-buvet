<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saif Mini Markeet</title>
<style>
/* The look: the shop's squared notebook. Cool paper, biro-blue ink, red pen for a loss, a rubber stamp for the verdict. */
:root{
  color-scheme:light;
  --paper:#f6f9fd; --grid:#dbe6f3; --sheet:#ffffff; --rule:#cfdcec;
  --ink:#14213d; --soft:#51607a; --biro:#1b3fa0; --biro-soft:#e3eafb;
  --red:#c8102e; --red-soft:#fde7ea; --green:#0b7a4b; --green-soft:#e0f4ea;
  --marker:#ffe45c; --amber:#7a5200; --amber-soft:#fff3c9;
  --font:"Noto Sans Arabic","Noto Naskh Arabic",Roboto,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:17px;line-height:1.55;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--biro);outline-offset:2px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
header{max-width:560px;margin:0 auto;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
header h1{margin:0;font-size:24px;font-weight:800;color:var(--biro);line-height:1.2}
header small{color:var(--soft);font-size:14px}
main{max-width:560px;margin:0 auto;padding:8px 14px 120px}
section[hidden]{display:none}
h2{font-size:18px;font-weight:800;margin:22px 2px 8px}
h2:first-child{margin-top:8px}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--rule)}
.pad{padding:14px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--rule);min-height:52px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:start}
.line:last-child{border-bottom:0}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-weight:700;overflow-wrap:anywhere}
.line .t span{color:var(--soft);font-size:14px}
.line .v{text-align:end;white-space:nowrap;font-weight:700;color:var(--biro)}
.line .v small{display:block;font-weight:400;color:var(--soft);font-size:13px}
.sum{font-weight:800}
.sum .v{font-size:19px}
.soft{color:var(--soft);font-size:14px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.b{background:var(--biro-soft);color:var(--biro)}
.red{color:var(--red)!important}.green{color:var(--green)!important}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:6px;padding:10px 16px;font-weight:700;min-height:50px}
.btn.go{background:var(--biro);color:#fff;border-color:var(--biro)}
.btn.warn{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:42px;padding:6px 12px;font-size:15px}
.btn.wide{width:100%}
.btn:active{transform:translate(1px,1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:15px;min-height:40px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-weight:700;font-size:15px;margin:12px 0 4px}
label small{font-weight:400;color:var(--soft)}
input[type=text],input[type=search],input[type=date],select{width:100%;border:1.5px solid var(--ink);border-radius:6px;background:#fff;padding:10px 12px;min-height:50px}
input::placeholder{color:#8c98ab}
.hint{font-size:14px;color:var(--biro);min-height:22px;margin-top:2px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:50px;height:50px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);font-size:24px;font-weight:700;line-height:1}
.step output{min-width:56px;text-align:center;font-size:24px;font-weight:800;color:var(--biro)}
/* the verdict: one rubber stamp */
.verdict{display:flex;align-items:center;gap:14px;padding:14px}
.stamp{flex:none;border:3px double currentColor;border-radius:8px;padding:4px 14px;font-size:24px;font-weight:800;transform:rotate(-7deg);letter-spacing:0}
.stamp.g{color:var(--green)}.stamp.r{color:var(--red)}.stamp.w{color:var(--soft)}
.verdict p{margin:0}
.verdict .big{font-size:24px;font-weight:800;color:var(--biro)}
.mark{background:linear-gradient(transparent 55%,var(--marker) 55%)}
.empty{padding:18px 14px;color:var(--soft)}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--sheet);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;font-size:14px;font-weight:700;color:var(--soft);min-height:58px;border-top:4px solid transparent}
nav button[aria-current=page]{color:var(--biro);border-top-color:var(--biro)}
#shade{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
#shade.on{display:flex}
#sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-top:1.5px solid var(--ink);border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet h2{margin-top:0}
#toast{position:fixed;inset-inline:16px;bottom:82px;margin:0 auto;max-width:420px;background:var(--ink);color:#fff;border-radius:6px;padding:10px 14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Saif Mini Markeet</h1><small id="date"></small></header>
<main>
  <section id="tab-today"></section>
  <section id="tab-goods" hidden></section>
  <section id="tab-credit" hidden></section>
  <section id="tab-spend" hidden></section>
  <section id="tab-report" hidden></section>
</main>
<nav><div>
  <button type="button" data-tab="today" aria-current="page">اليوم</button>
  <button type="button" data-tab="goods">السلع</button>
  <button type="button" data-tab="credit">الكريدي</button>
  <button type="button" data-tab="spend">المصاريف</button>
  <button type="button" data-tab="report">الحساب</button>
</div></nav>
<div id="shade"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------- data ---------- */
var KEY="saif-mini-markeet-v1";
var SECS=["شكلاطة وسناكس","ماء","عصائر ومشروبات","أدوات مدرسية","حلوى وعلكة","بطاقات شحن","أخرى"];
/* name, section, barcode, pieces per carton, carton price (millimes), sell price per piece (millimes), stock, note */
var SEED=[
["مومنتو",0,"6191544100302",24,24000,1500,54,""],
["X-Plose",0,"6191544100760",24,26500,1500,73,""],
["كيت كات Dark",0,"6294017137437",24,24000,1700,48,""],
["شكلاطة Said",0,"6194005412037",24,null,1500,24,"سعر شراء الكرتونة ناقص، لوّج عليه في الفواتير القديمة"],
["شكلاطة Krosss",0,"6194005492077",24,6800,500,119,""],
["بسكويت جوفريتشو",0,"6194000521895",21,28500,2000,59,""],
["كيك براونيز",0,"6194008554833",30,21600,1200,201,""],
["كروستينا",0,"6194008541123",40,19000,700,76,""],
["Happy Full",0,"6194005498284",12,13300,1500,17,""],
["سناكس فلفول",0,"6194005498024",50,25000,500,80,"عدّ كرتونة كاملة: إذا فيها 50 أكهو، ما فيهاش ربح"],
["شيبس بوبيتوس",0,"6191595600639",40,30000,1000,13,"سعر الكرتونة (30 د) تقريبي"],
["كاكي",0,"6191415900031",50,7500,250,950,"الكمية (19 كرتونة) وسعر الشراء لازمهم تثبيت"],
["محارم أنف",0,"6192011803672",10,2500,500,84,""],
["ماء 1.5 لتر",1,"6191496000071",6,4500,1200,50,""],
["ماء 1 لتر",1,"6194039503015",6,3800,1000,59,"الباركود متاع الباكو، موش الدبوزة"],
["ماء 0.5 لتر Délice",1,"6191496000019",12,6000,800,70,""],
["عصير أوفروي Ifri",2,"6130093068626",12,14000,2000,23,""],
["عصير دايلي",2,"6132501549512",30,13000,1000,162,"سعر الكرتونة ساعات 12 د وساعات 13 د"],
["عصير ديلي جوي",2,"6134427000122",48,12000,700,155,""],
["غازية كانات برتقال",2,"6133489004284",6,5000,2000,19,""],
["غازية بلاستيك ليمون",2,"6134807000087",12,12000,1500,16,""],
["أقلام رصاص",3,"",1,null,700,47,"سلعة راكدة، وسعر الشراء منسي"],
["أقلام حبر",3,"",50,25000,1000,29,""],
["أوراق مليمترية",3,"",1,null,500,104,"سعر الشراء منسي"],
["حلوى فلاي",4,"",null,8500,100,101,"عدّ علبة كاملة باش نعرفو كلفة القطعة"],
["علكة سويت",4,"",142,8500,100,365,"142 في العلبة تقريبي"],
["علكة Ballon",4,"",194,10000,100,174,""],
["علكة Génial",4,"",133,8500,100,36,"133 في العلبة تقريبي"],
["بطاقة تيليكوم 1 د",5,"",1,1150,1500,14,""],
["بطاقة أورنج 1 د",5,"",1,1150,1500,3,""],
["بطاقة أوريدو 1 د",5,"",1,1150,1500,10,""]
];
var S,tab="today",sheet=null,ui={q:"",sec:"الكل",period:"today"};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function seed(){
  return {v:1,products:SEED.map(function(r,i){return {id:"p"+i,name:r[0],sec:SECS[r[1]],bc:r[2],per:r[3],cprice:r[4],sell:r[5],stock:r[6],note:r[7]}}),
    sales:[],cartons:[],customers:[],credit:[],expenses:[],
    home:[{id:"h0",name:"فريكاسي",sell:1200,ucost:null,plan:30}],homeDays:[]};
}
function load(){
  try{var t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);if(S&&S.products)return}}catch(e){}
  S=seed();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("ما نجّمتش نسجّل: الذاكرة معبّية")}}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function addDays(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
/* money is kept in millimes; shown as dinars with 3 decimals */
function dt(m){if(m==null||isNaN(m))return '<span class="soft">؟</span>';var r=Math.round(m),neg=r<0;r=Math.abs(r);
  return '<bdi class="n">'+(neg?"−":"")+Math.floor(r/1000)+","+("00"+(r%1000)).slice(-3)+'</bdi> د'}
function num(v){var s=String(v==null?"":v).replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c)}).replace(/٫|,/g,".").replace(/[^0-9.]/g,"");
  if(s===""||s===".")return null;var f=parseFloat(s);return isNaN(f)?null:f}
/* typed in dinars; a number too big to be dinars is read as millimes (500 means 0,500 د) */
function money(v,limit){var f=num(v);if(f==null)return null;return f>=limit?Math.round(f):Math.round(f*1000)}
function piece(v){return money(v,50)}
function carton(v){return money(v,1000)}
function amount(v){return money(v,100000)}
function int(v){var f=num(v);return f==null?null:Math.round(f)}
function cost(p){return (p.cprice!=null&&p.per)?p.cprice/p.per:null}
function prod(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null}
function cust(id){for(var i=0;i<S.customers.length;i++)if(S.customers[i].id===id)return S.customers[i];return null}
function hitem(id){for(var i=0;i<S.home.length;i++)if(S.home[i].id===id)return S.home[i];return null}
function owed(cid){var t=0;S.credit.forEach(function(c){if(c.cid===cid)t+=c.amt});return t}
function hday(hid,d,make){for(var i=0;i<S.homeDays.length;i++){var x=S.homeDays[i];if(x.hid===hid&&x.d===d)return x}
  if(!make)return null;var h=hitem(hid),r={hid:hid,d:d,made:0,sold:0,sell:h.sell,ucost:h.ucost};S.homeDays.push(r);return r}
function verdict(p){var c=cost(p);
  if(p.sell==null)return ["a","ينقص سعر البيع"];
  if(c==null)return ["a","ينقص سعر الشراء"];
  var d=Math.round(p.sell-c);
  if(d>0)return ["g","ربح"];if(d<0)return ["r","خسارة"];return ["a","بلاش"]}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2400)}

/* ---------- numbers for a period ---------- */
function range(k){var t=today();if(k==="today")return [t,t];if(k==="week")return [addDays(t,-6),t];if(k==="month")return [t.slice(0,8)+"01",t];return ["0000-00-00","9999-99-99"]}
function totals(k){var r=range(k),a=r[0],b=r[1],o={sales:0,known:0,profit:0,unknown:0,hIn:0,hCost:0,hNoCost:false,shop:0,personal:0,bought:0,per:{}};
  S.sales.forEach(function(s){if(s.d<a||s.d>b)return;var v=s.qty*s.sell;o.sales+=v;
    var e=o.per[s.pid]||(o.per[s.pid]={name:s.name,qty:0,v:0,profit:0,unknown:false});e.qty+=s.qty;e.v+=v;
    if(s.cost==null){o.unknown+=v;e.unknown=true}else{o.known+=v;var g=v-s.qty*s.cost;o.profit+=g;e.profit+=g}});
  S.homeDays.forEach(function(h){if(h.d<a||h.d>b)return;o.hIn+=h.sold*h.sell;if(h.ucost==null){if(h.made||h.sold)o.hNoCost=true}else o.hCost+=h.made*h.ucost});
  S.expenses.forEach(function(e){if(e.d<a||e.d>b)return;if(e.kind==="personal")o.personal+=e.amt;else o.shop+=e.amt});
  S.cartons.forEach(function(c){if(c.d<a||c.d>b)return;o.bought+=c.n*c.price});
  o.hProfit=o.hIn-o.hCost;o.gross=o.profit+o.hProfit;o.net=o.gross-o.shop;o.income=o.sales+o.hIn;return o}
function stockTotals(){var o={cost:0,sell:0,profit:0,noCost:0,pieces:0};S.products.forEach(function(p){var c=cost(p),v=(p.sell||0)*p.stock;o.pieces+=p.stock;o.sell+=v;
  if(c==null)o.noCost+=v;else{o.cost+=c*p.stock;o.profit+=v-c*p.stock}});return o}

/* ---------- screens ---------- */
function stampOf(v,has){if(!has)return '<span class="stamp w">مازال</span>';return v>0?'<span class="stamp g">رابح</span>':v<0?'<span class="stamp r">خاسر</span>':'<span class="stamp w">بلاش</span>'}
function rToday(){
  var t=totals("today"),d=today(),has=t.income>0||t.hCost>0,h='';
  h+='<div class="sheet verdict">'+stampOf(t.gross,has)+'<p>'+(has?'ربح اليوم <span class="big">'+dt(t.gross)+'</span><br><span class="soft">بعت بـ '+dt(t.income)+'</span>':'ما سجّلتش بيع اليوم. اضغط على السلعة اللي بعتها.')+'</p></div>';
  /* home-made */
  S.home.forEach(function(it){var r=hday(it.id,d)||{made:0,sold:0,sell:it.sell,ucost:it.ucost};
    var inc=r.sold*r.sell,left=r.made-r.sold;
    h+='<h2>'+esc(it.name)+' اليوم</h2><div class="sheet">'
     +'<div class="line"><div class="t"><b>حضّرت</b><span>العادة '+it.plan+'</span></div><div class="step"><button type="button" data-act="hm" data-id="'+it.id+'" data-k="made" data-n="-1" aria-label="نقّص">−</button><output>'+r.made+'</output><button type="button" data-act="hm" data-id="'+it.id+'" data-k="made" data-n="1" aria-label="زيد">+</button></div></div>'
     +'<div class="line"><div class="t"><b>بعت</b><span>'+(r.made?(left>0?'باقي '+left:'كمّلتهم الكل'):'القطعة بـ '+dt(it.sell))+'</span></div><div class="step"><button type="button" data-act="hm" data-id="'+it.id+'" data-k="sold" data-n="-1" aria-label="نقّص">−</button><output>'+r.sold+'</output><button type="button" data-act="hm" data-id="'+it.id+'" data-k="sold" data-n="1" aria-label="زيد">+</button></div></div>'
     +'<div class="line sum"><div class="t"><b>الدخل</b><span>'+(r.ucost==null?'الكلفة موش مسجّلة، الربح موش معروف':'الربح '+dt(inc-r.made*r.ucost))+'</span></div><div class="v">'+dt(inc)+'</div></div>'
     +'<div class="pad row"><button type="button" class="btn sm" data-act="hfill" data-id="'+it.id+'">حضّرت '+it.plan+'</button><button type="button" class="btn sm" data-act="hall" data-id="'+it.id+'">تباعو الكل</button><button type="button" class="btn sm" data-act="hset" data-id="'+it.id+'">السعر والكلفة</button></div></div>';
  });
  h+='<div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-act="hnew">+ حاجة أخرى نصنعها في الدار</button></div>';
  /* sell */
  h+='<h2>بيع سلعة</h2><div class="row"><input class="grow" type="search" id="q" placeholder="لوّج بالاسم ولا بالباركود" value="'+esc(ui.q)+'" autocomplete="off">'
    +(window.Android?'<button type="button" class="btn" data-act="scan">سكاني</button>':'')+'</div><div id="found" style="margin-top:10px"></div>';
  /* log */
  var log=S.sales.filter(function(s){return s.d===d}).reverse();
  h+='<h2>بيع اليوم</h2><div class="sheet">';
  if(!log.length)h+='<div class="empty">فارغ. كل بيعة تسجّلها تظهر هنا.</div>';
  log.forEach(function(s){h+='<div class="line"><div class="t"><b>'+esc(s.name)+' × '+s.qty+'</b><span>'+(s.cid?'كريدي: '+esc((cust(s.cid)||{}).name||'؟'):'نقداً')+'</span></div><div class="v">'+dt(s.qty*s.sell)+'</div><button type="button" class="btn sm warn" data-act="unsell" data-id="'+s.id+'">امسح</button></div>'});
  h+='</div>';
  $("tab-today").innerHTML=h;rFound();
}
function rFound(){var e=$("found");if(!e)return;var q=ui.q.trim().toLowerCase(),h='<div class="sheet">';
  var list=S.products.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>=0||(p.bc&&p.bc.indexOf(q)>=0)});
  if(!q){var cnt={};S.sales.forEach(function(s){cnt[s.pid]=(cnt[s.pid]||0)+s.qty});list=list.slice().sort(function(a,b){return (cnt[b.id]||0)-(cnt[a.id]||0)})}
  if(!list.length)h+='<div class="empty">ما لقيتش سلعة بالاسم هذا. <button type="button" class="btn sm" data-act="pnew">زيدها</button></div>';
  list.forEach(function(p){h+='<button type="button" class="line" data-act="sell" data-id="'+p.id+'"><div class="t"><b>'+esc(p.name)+'</b><span>عندك '+p.stock+'</span></div><div class="v">'+dt(p.sell)+'</div></button>'});
  e.innerHTML=h+'</div>'}
function rGoods(){
  var st=stockTotals(),h='';
  h+='<div class="sheet"><div class="line sum"><div class="t"><b>قيمة السلعة بسعر البيع</b><span>'+st.pieces+' قطعة</span></div><div class="v">'+dt(st.sell)+'</div></div>'

/* live answer under the price fields: what the piece costs and whether it wins */
function hint(){var e=$("hint");if(!e||!sheet)return;var k=sheet.kind,t="";
  if(k==="sell"){var pr=piece(val("f-price"));t=pr==null?"اكتب السعر":"المجموع: "+dt(pr*sheet.qty)}
  else if(k==="pedit"||k==="cart"){var cp=carton(val("f-cprice")),per=int(val("f-per")),se=piece(val("f-sell"));
    if(cp!=null&&per>0){var c=cp/per;t="القطعة تطلع عليك "+dt(c);if(se!=null){var g=Math.round(se-c);t+=g>0?"، تربح "+dt(g)+" في القطعة":g<0?"، تخسر "+dt(-g)+" في القطعة":"، ما تربح فيها شي"}
      if(k==="cart"){var n=int(val("f-n"))||0;if(n>0)t+=". الكل: "+dt(cp*n)}}
    else if(se!=null)t="تبيع القطعة بـ "+dt(se)}
  else if(k==="hset"){var b=amount(val("f-batch")),pl=int(val("f-plan")),hs=piece(val("f-sell"));
    if(b!=null&&pl>0){var u=b/pl;t="الوحدة تطلع عليك "+dt(u);if(hs!=null)t+="، تربح "+dt(hs-u)+" في الوحدة و"+dt((hs-u)*pl)+" في النهار"}}
  e.innerHTML=t}

  if(a==="period"){ui.period=d.k;rReport();return}
  if(a==="scan"){if(window.Android)Android.scan();return}
  if(a==="sell"){p=prod(d.id);if(p.sell==null){toast("حط سعر البيع قبل");open({kind:"pedit",id:p.id});return}open({kind:"sell",id:p.id,qty:1,price:p.sell});return}
  if(a==="q"){s.qty=Math.max(1,s.qty+ +d.n);$("qty").textContent=s.qty;hint();return}
  if(a==="sellok"){p=prod(s.id);var pr=piece(val("f-price"));if(pr==null){toast("اكتب السعر");return}
    var cid=val("f-cust");if(cid==="+"){var nm=val("f-cname").trim();if(!nm){toast("اكتب اسم الحريف");return}c={id:uid(),name:nm};S.customers.push(c);cid=c.id}
    x={id:uid(),d:today(),pid:p.id,name:p.name,qty:s.qty,sell:pr,cost:cost(p),cid:cid||null};S.sales.push(x);p.stock-=s.qty;
    if(cid)S.credit.push({id:uid(),d:x.d,cid:cid,amt:pr*s.qty,note:p.name+" × "+s.qty,sale:x.id});
    save();closeSheet();render();toast("تسجّل: "+p.name+" × "+x.qty);return}
  if(a==="unsell"){ask("نمسح البيعة؟","القطع ترجع للسلعة، وإذا كانت بالكريدي تتمسح من حساب الحريف.","امسح",function(){
      for(var i=0;i<S.sales.length;i++)if(S.sales[i].id===d.id){x=S.sales[i];p=prod(x.pid);if(p)p.stock+=x.qty;S.sales.splice(i,1);break}
      S.credit=S.credit.filter(function(k){return k.sale!==d.id})});return}
  if(a==="pnew"){open({kind:"pedit",id:null,bc:d.bc||""});return}
  if(a==="pview"){open({kind:"pview",id:d.id});return}
  if(a==="pedit"){open({kind:"pedit",id:d.id});return}
  if(a==="psave"){var name=val("f-name").trim();if(!name){toast("اكتب اسم السلعة");return}
    p=s.id?prod(s.id):null;if(!p){p={id:uid(),stock:0};S.products.push(p)}
    p.name=name;p.sec=val("f-sec");p.bc=val("f-bc").replace(/\s/g,"");p.cprice=carton(val("f-cprice"));x=int(val("f-per"));p.per=x>0?x:null;p.sell=piece(val("f-sell"));x=int(val("f-stock"));p.stock=x==null?0:x;p.note=val("f-note").trim();
    save();closeSheet();render();toast("تسجّلت: "+name);return}
  if(a==="pdel"){p=prod(d.id);ask("نمسح "+p.name+"؟","السلعة تتمسح من القائمة. البيع القديم يبقى في الحساب.","امسح",function(){S.products=S.products.filter(function(k){return k.id!==d.id})});return}
  if(a==="cart"){open({kind:"cart",id:d.id});return}
  if(a==="cartok"){p=prod(s.id);var n=int(val("f-n")),per=int(val("f-per")),cp=carton(val("f-cprice")),se=piece(val("f-sell"));
    if(!(n>0)||!(per>0)){toast("اكتب عدد الكراتن وعدد القطع");return}if(cp==null){toast("اكتب سعر الكرتونة");return}
    p.per=per;p.cprice=cp;if(se!=null)p.sell=se;p.stock+=n*per;S.cartons.push({id:uid(),d:today(),pid:p.id,n:n,per:per,price:cp});
    save();closeSheet();render();toast("زدت "+(n*per)+" قطعة");return}
  if(a==="cnew"){open({kind:"cnew"});return}
  if(a==="cnewok"){x=val("f-cname").trim();if(!x){toast("اكتب الاسم");return}c={id:uid(),name:x};S.customers.push(c);var am=amount(val("f-amt"));if(am>0)S.credit.push({id:uid(),d:today(),cid:c.id,amt:am,note:"كريدي قديم"});save();closeSheet();render();return}
  if(a==="cview"){open({kind:"cview",id:d.id});return}
  if(a==="cpay"||a==="cadd"){x=amount(val("f-amt"));if(!(x>0)){toast("اكتب المبلغ");return}S.credit.push({id:uid(),d:today(),cid:d.id,amt:a==="cpay"?-x:x,note:val("f-note").trim()});save();render();open({kind:"cview",id:d.id});toast(a==="cpay"?"تسجّل الخلاص":"تسجّل الكريدي");return}
  if(a==="cdel"){c=cust(d.id);ask("نمسح "+c.name+"؟","الحريف وحركاتو الكل يتمسحو.","امسح",function(){S.customers=S.customers.filter(function(k){return k.id!==d.id});S.credit=S.credit.filter(function(k){return k.cid!==d.id})});return}
  if(a==="enew"){open({kind:"enew",k:d.k});return}
  if(a==="eok"){x=amount(val("f-amt"));var lb=val("f-label").trim();if(!lb){toast("اكتب على شنوّة");return}if(!(x>0)){toast("اكتب المبلغ");return}S.expenses.push({id:uid(),d:val("f-date")||today(),kind:s.k,label:lb,amt:x});save();closeSheet();render();return}
  if(a==="edel"){ask("نمسح المصروف؟","يتمسح من الحساب.","امسح",function(){S.expenses=S.expenses.filter(function(k){return k.id!==d.id})});return}
  if(a==="hm"){x=hday(d.id,today(),true);x[d.k]=Math.max(0,x[d.k]+ +d.n);if(x.sold>x.made)x.made=x.sold;save();rToday();return}
  if(a==="hfill"){x=hday(d.id,today(),true);x.made=Math.max(x.sold,hitem(d.id).plan||0);save();rToday();return}
  if(a==="hall"){x=hday(d.id,today(),true);x.sold=x.made;save();rToday();return}
  if(a==="hset"){open({kind:"hset",id:d.id});return}
  if(a==="hnew"){open({kind:"hset",id:null});return}
  if(a==="hsave"){var hn=val("f-name").trim(),hs=piece(val("f-sell")),pl=int(val("f-plan")),bt=amount(val("f-batch"));if(!hn){toast("اكتب الاسم");return}if(hs==null){toast("اكتب سعر البيع");return}
    var it=s.id?hitem(s.id):null;if(!it){it={id:uid()};S.home.push(it)}it.name=hn;it.sell=hs;it.plan=pl>0?pl:30;it.ucost=(bt!=null&&it.plan>0)?bt/it.plan:null;
    x=hday(it.id,today());if(x){x.sell=it.sell;x.ucost=it.ucost}save();closeSheet();render();return}
  if(a==="hdel"){ask("نمسحها؟","تتمسح مع أيامها الكل.","امسح",function(){S.home=S.home.filter(function(k){return k.id!==d.id});S.homeDays=S.homeDays.filter(function(k){return k.hid!==d.id})});return}
  if(a==="backup"){open({kind:"backup"});return}
  if(a==="share"){Android.share(JSON.stringify(S));return}
  if(a==="copy"){var e=$("f-text");e.select();try{document.execCommand("copy");toast("تنسخت")}catch(err){toast("انسخها بيدك")}return}
  if(a==="restore"){open({kind:"restore"});return}
  if(a==="restoreok"){try{x=JSON.parse(val("f-text"));if(!x||!x.products||!x.sales)throw 0;S=x;save();closeSheet();render();toast("رجعت النسخة")}catch(err){toast("النص هذا موش نسخة صحيحة")}return}
  if(a==="yes"){var fn=s.fn;closeSheet();fn();save();render();return}
}
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-act],[data-tab]");
  if(!b){if(ev.target.id==="shade")closeSheet();return}
  if(b.dataset.tab){go(b.dataset.tab);return}act(b.dataset.act,b)});
document.addEventListener("input",function(ev){var t=ev.target;if(t.id==="q"){ui.q=t.value;rFound();return}hint()});
document.addEventListener("change",function(ev){if(ev.target.id==="f-cust"){$("newc").hidden=ev.target.value!=="+"}});
/* called by the Android shell */
function appBack(){if(sheet){closeSheet();return "closed"}if(tab!=="today"){go("today");return "closed"}return "none"}
function onScan(code){code=String(code||"").trim();if(!code)return;
  if(sheet&&sheet.kind==="pedit"){$("f-bc").value=code;return}
  for(var i=0;i<S.products.length;i++)if(S.products[i].bc===code){act("sell",{dataset:{id:S.products[i].id}});return}
  ask("سلعة موش مسجّلة","الباركود "+code+" ما لقيتوش. تحب تزيدها؟","زيدها",function(){setTimeout(function(){open({kind:"pedit",id:null,bc:code})},0)})}
load();render();
</script>
</body>
</html>
