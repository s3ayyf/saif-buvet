plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saif.buvet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saif.buvet'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed key kept in the repo, so every build has the same signature and
    // a new version installs over the old one without losing the shop's data.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
